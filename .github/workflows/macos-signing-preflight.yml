name: macOS Signing Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/macos-signing-preflight.yml'
      - '.github/workflows/release.yml'
      - 'docs/BUILD.md'
      - 'docs/platform/macos.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    name: Developer ID + notarization credentials
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Validate required Apple secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing required macOS release secrets:$missing"
            exit 1
          fi

      - name: Validate Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/volo-developer-id.p12"
          keychain_path="$RUNNER_TEMP/volo-signing-preflight.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "No valid Developer ID Application identity found in APPLE_CERTIFICATE"
            exit 1
          fi

          echo "Developer ID Application certificate accepted."

      - name: Validate App Store Connect notarization credentials
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          cleanup() {
            rm -f "$api_key_path"
          }
          trap cleanup EXIT

          printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"

          xcrun notarytool history \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json > "$RUNNER_TEMP/notary-history.json"

          echo "App Store Connect notarization credentials accepted."
