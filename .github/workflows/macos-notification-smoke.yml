name: macOS Notification Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/macos-notification-smoke.yml'
      - 'src-tauri/examples/macos_notification_smoke.rs'
      - 'src-tauri/src/ai/tools.rs'
      - 'src-tauri/src/api/notification.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/macos-notification-smoke.yml'
      - 'src-tauri/examples/macos_notification_smoke.rs'
      - 'src-tauri/src/ai/tools.rs'
      - 'src-tauri/src/api/notification.rs'
      - 'src-tauri/src/lib.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri.conf.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notification-smoke:
    name: Native notification path
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run native macOS notification smoke
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: '1'
        run: cargo run --all-features --example macos_notification_smoke
